# Servidor Evolution API de UMA escola. Suba um destes por escola (cada um com a sua chave e o seu número de WhatsApp).
# Uso: copie esta pasta para o servidor da escola, crie o arquivo .env (veja docs/evolution-por-escola.md) e rode: docker compose up -d
services:
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    ports: ["8080:8080"]
    env_file: .env
    volumes: [evolution_instances:/evolution/instances]
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment: { POSTGRES_DB: evolution, POSTGRES_USER: evolution, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
volumes: { evolution_instances: {}, pgdata: {} }
