<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Fatura · Pé na Grama</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components.css">
<style>
.cl-top{background:var(--grad-side-head);padding:14px 20px;display:flex;justify-content:center}
.cl-top img{height:56px;width:auto}
.cl-wrap{max-width:560px;margin:0 auto;padding:28px 18px 70px;display:grid;gap:18px}
.fa-valor{font:900 44px/1 var(--font-primary);color:var(--slate-900);margin:14px 0 6px}
.fa-qr{display:grid;place-items:center;background:#fff;border:1px solid var(--border-color);border-radius:var(--radius-md);padding:14px;width:min(264px,100%);margin:0 auto}
.fa-qr svg{width:100%;height:auto;display:block}
.fa-code{font:600 12px/1.5 var(--font-mono);word-break:break-all;background:var(--surface-soft);border:1px solid var(--border-color);border-radius:var(--radius);padding:10px 12px;max-height:96px;overflow:auto;user-select:all}
.cl-ok{text-align:center;display:grid;gap:12px;justify-items:center}
.cl-ok .sel{width:64px;height:64px;border-radius:50%;background:var(--kpi-green);color:#fff;display:grid;place-items:center}
.cl-ok .sel svg{width:32px;height:32px}
</style>
</head>
<body class="pg">
<div class="cl-top"><img src="assets/logo-branco.png" alt="Pé na Grama"></div>
<main class="cl-wrap" id="raiz"><div class="pg-empty">Carregando fatura…</div></main>
<script src="ds/icons.js"></script>
<script>
const E = PG.esc, I = PG.icon, brl = PG.brl, $ = (s, r = document) => r.querySelector(s);
const t = new URLSearchParams(location.search).get('t') || '', raiz = $('#raiz');
const ST = { aberta: ['Em aberto', 'warn'], informada: ['Pagamento informado', 'info'], paga: ['Paga', 'ok'], cancelada: ['Cancelada', ''] };
function erroTela(m) { raiz.innerHTML = `<div class="pg-card"><div class="pg-card-title">${I('alert')} Não foi possível abrir a fatura</div><p class="pg-sub" style="margin-top:10px">${E(m)}</p></div>`; }
const wa = (num, msg) => { let d = String(num || '').replace(/\D/g, ''); if (d && d.length <= 11) d = '55' + d; return d ? 'https://wa.me/' + d + '?text=' + encodeURIComponent(msg) : ''; };
function qr(texto) {
  return new Promise(res => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = () => { try { const q = qrcode(0, 'M'); q.addData(texto); q.make(); res(q.createSvgTag({ cellSize: 4, margin: 0, scalable: true })); } catch { res(''); } }; s.onerror = () => res(''); document.head.appendChild(s); });
}
async function carregar() {
  if (!/^[0-9a-f]{32}$/.test(t)) return erroTela('O link está incompleto.');
  const r = await fetch('/api/fatura/' + t), f = await r.json().catch(() => ({}));
  if (!r.ok) return erroTela(f.erro || 'Fatura não encontrada.');
  const [stt, cor] = ST[f.status] || [f.status, ''];
  const cab = `<div class="pg-card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><div class="pg-kpi-label">${E(f.empresa)}</div><div class="pg-card-title" style="margin-top:6px">${E(f.escola)}</div></div><span class="pg-badge ${cor}">${E(stt)}</span></div>
    <div class="fa-valor">${brl(f.valor)}</div><p class="pg-sub" style="margin:0">${E(f.descricao)} · vence em ${PG.data(f.vencimento)}${f.atrasada ? ' <span class="pg-badge bad">Atrasada</span>' : ''}</p></div>`;
  if (f.status === 'paga') { raiz.innerHTML = cab + `<div class="pg-card cl-ok"><span class="sel">${I('check')}</span><b>Pagamento confirmado${f.pago_em ? ' em ' + PG.data(f.pago_em) : ''}</b><p class="pg-sub">Obrigado! Nada mais a fazer por aqui.</p></div>`; return; }
  if (f.status === 'cancelada') { raiz.innerHTML = cab + `<div class="pg-alert">Esta fatura foi cancelada.</div>`; return; }
  const aviso = f.status === 'informada' ? `<div class="pg-alert ok">Recebemos o seu aviso de pagamento. Vamos conferir e confirmar em breve.</div>` : '';
  const zap = wa(f.whats, `Olá! Quero pagar a fatura "${f.descricao}" da ${f.escola} (${brl(f.valor)}).`);
  let pix = '';
  if (f.pix && f.pix.payload) {
    const svg = await qr(f.pix.payload);
    pix = `<div class="pg-card"><div class="pg-card-title">${I('dollar')} Pague com Pix</div><p class="pg-sub" style="margin:10px 0 14px">Abra o app do seu banco, escolha Pix e leia o código ou use o "copia e cola".</p>
      ${svg ? `<div class="fa-qr" aria-label="QR Code do Pix">${svg}</div>` : ''}
      <div class="pg-stack" style="margin-top:16px"><div class="fa-code" id="code">${E(f.pix.payload)}</div><button class="pg-btn green" id="cp" style="padding:14px">${I('copy')} Copiar código Pix</button>
      <p class="pg-hint">Recebedor: ${E(f.pix.nome)}</p></div></div>`;
  } else {
    pix = `<div class="pg-card"><div class="pg-card-title">${I('dollar')} Como pagar</div><p class="pg-sub" style="margin-top:10px">O Pix desta fatura ainda não foi gerado. Fale com a gente e enviamos o código na hora.</p></div>`;
  }
  const online = f.asaas ? `<div class="pg-card"><div class="pg-card-title">${I('dollar')} Pagar online</div><p class="pg-sub" style="margin:10px 0 14px">Pix, boleto ou cartão, em uma página segura. A baixa é automática.</p><a class="pg-btn green" style="padding:14px;width:100%;justify-content:center" href="${E(f.asaas)}" target="_blank" rel="noopener">Pagar esta fatura</a></div>` : '';
  raiz.innerHTML = cab + aviso + online + pix + `<div class="pg-card soft"><div class="pg-stack">${f.status === 'aberta' ? `<button class="pg-btn" id="pg" style="padding:14px">Já fiz o pagamento</button>` : ''}${zap ? `<a class="pg-btn ok" target="_blank" rel="noopener" href="${E(zap)}">${I('whats')} Falar no WhatsApp</a>` : ''}</div></div>`;
  const cp = $('#cp'); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(f.pix.payload); } catch { const r = document.createRange(); r.selectNodeContents($('#code')); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); } cp.textContent = 'Código copiado'; setTimeout(() => cp.innerHTML = I('copy') + ' Copiar código Pix', 2200); };
  const pg = $('#pg'); if (pg) pg.onclick = async () => { pg.disabled = true; const r = await fetch('/api/fatura/' + t + '/paguei', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }); if (r.ok) carregar(); else { pg.disabled = false; pg.textContent = 'Não deu certo. Tente de novo'; } };
}
carregar().catch(() => erroTela('Sem conexão. Confira a internet e tente de novo.'));
</script>
</body>
</html>
