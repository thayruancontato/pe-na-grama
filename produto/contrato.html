<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contrato · Pé na Grama</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components.css">
<style>
.cl-top{background:var(--grad-side-head);padding:14px 20px;display:flex;justify-content:center}
.cl-top img{height:56px;width:auto}
.cl-wrap{max-width:820px;margin:0 auto;padding:28px 18px 70px;display:grid;gap:20px}
.cl-resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cl-resumo div{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-card-soft);padding:14px 16px}
.cl-resumo small{display:block;font:800 11.5px/1.2 var(--font-primary);text-transform:uppercase;letter-spacing:.5px;color:var(--slate-500)}
.cl-resumo b{display:block;font:900 20px/1.2 var(--font-primary);margin-top:6px;color:var(--slate-900)}
@media(max-width:640px){.cl-resumo{grid-template-columns:1fr 1fr}}
.cl-texto{white-space:pre-wrap;font-size:14.4px;line-height:1.6;max-height:420px;overflow:auto;background:var(--surface-soft);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:18px 20px}
.cl-ok{text-align:center;display:grid;gap:12px;justify-items:center;padding:12px 0}
.cl-ok .sel{width:64px;height:64px;border-radius:50%;background:var(--kpi-green);color:#fff;display:grid;place-items:center}
.cl-ok .sel svg{width:32px;height:32px}
.pg-check.aceite{align-items:flex-start;font-weight:700;border:0;padding:4px 0}
</style>
</head>
<body class="pg">
<div class="cl-top"><img src="assets/logo-branco.png" alt="Pé na Grama"></div>
<main class="cl-wrap" id="raiz"><div class="pg-empty">Carregando contrato…</div></main>
<script src="ds/icons.js"></script>
<script>
const E = PG.esc, I = PG.icon, brl = PG.brl, $ = (s, r = document) => r.querySelector(s);
const t = new URLSearchParams(location.search).get('t') || '';
const raiz = $('#raiz');
const docMask = v => { const d = v.replace(/\D/g, '').slice(0, 14); return d.length <= 11 ? d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2') : d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2'); };

function erroTela(msg) { raiz.innerHTML = `<div class="pg-card"><div class="pg-card-title">${I('alert')} Não foi possível abrir o contrato</div><p class="pg-sub" style="margin-top:10px">${E(msg)}</p><p class="pg-sub" style="margin-top:6px">Peça um novo link para quem enviou este contrato.</p></div>`; }
function resumo(c) { return `<div class="cl-resumo"><div><small>Plano</small><b>${E(c.plano)}</b></div><div><small>Mensalidade</small><b>${brl(c.mensal)}</b></div><div><small>Implantação</small><b>${c.implantacao ? brl(c.implantacao) : 'sem custo'}</b></div><div><small>Vencimento</small><b>Dia ${c.dia}</b></div></div>`; }
function assinado(c, fatura) {
  raiz.innerHTML = `<div class="pg-card cl-ok"><span class="sel">${I('check')}</span><h1 class="pg-title" style="font-size:24px">Contrato assinado</h1>
    <p class="pg-sub">${E(c.escola)} assinou em ${PG.data(c.assinado_em)}${c.assinante ? ' · ' + E(c.assinante) : ''}.</p>
    ${fatura ? `<p>Falta só o pagamento da primeira fatura para começarmos a implantação.</p><a class="pg-btn green" href="fatura?t=${E(fatura)}">Ver fatura e pagar com Pix</a>` : ''}</div>${resumo(c)}
    <details class="pg-card soft"><summary class="pg-link">Reler o contrato</summary><div class="cl-texto" style="margin-top:14px">${E(c.texto)}</div></details>`;
}

async function carregar() {
  if (!/^[0-9a-f]{48}$/.test(t)) return erroTela('O link está incompleto.');
  const r = await fetch('/api/contrato/' + t), c = await r.json().catch(() => ({}));
  if (!r.ok) return erroTela(c.erro || 'Contrato não encontrado.');
  if (c.status === 'cancelado') return erroTela('Este contrato foi cancelado.');
  if (c.status === 'assinado') return assinado(c, c.fatura);
  raiz.innerHTML = `<div class="pg-page-head" style="margin:0"><div><h1 class="pg-title">Contrato</h1><p class="pg-sub">${E(c.escola)} · enviado por ${E(c.empresa)}</p></div></div>${resumo(c)}
    <div class="pg-card"><div class="pg-card-title">${I('file')} Termos</div><div class="cl-texto" id="tx" tabindex="0" style="margin-top:14px">${E(c.texto)}</div></div>
    <form class="pg-card" id="f" novalidate><div class="pg-card-title">${I('pencil')} Assinar</div><div class="pg-stack" style="margin-top:14px">
      <div class="pg-field"><label class="pg-label" for="n">Nome completo de quem assina</label><input class="pg-input" id="n" autocomplete="name" value="${E(c.sugestao_nome || '')}" required></div>
      <div class="pg-field"><label class="pg-label" for="d">CPF ou CNPJ</label><input class="pg-input" id="d" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required></div>
      <label class="pg-check aceite"><input type="checkbox" id="a"><span>Li o contrato e concordo com os termos. Entendo que esta assinatura eletrônica tem o mesmo efeito de uma assinatura no papel.</span></label>
      <div class="pg-alert bad" id="e" hidden></div>
      <button class="pg-btn green" id="b" style="padding:16px 22px;font-size:15px">Assinar contrato</button>
      <p class="pg-hint">Guardamos nome, documento, data, hora e endereço de acesso como prova da assinatura.</p></div></form>`;
  $('#d').addEventListener('input', e => e.target.value = docMask(e.target.value));
  $('#f').onsubmit = async ev => {
    ev.preventDefault(); const e = $('#e'), b = $('#b'); e.hidden = true;
    if (!$('#a').checked) { e.textContent = 'Marque a caixa para confirmar que leu e concorda.'; e.hidden = false; return; }
    b.disabled = true; b.textContent = 'Assinando…';
    const r = await fetch('/api/contrato/' + t + '/assinar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ nome: $('#n').value, documento: $('#d').value, aceito: true }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { if (j.fatura) location.href = 'fatura?t=' + j.fatura; else carregar(); return; }
    e.textContent = j.erro || 'Não foi possível assinar. Tente de novo.'; e.hidden = false; b.disabled = false; b.textContent = 'Assinar contrato';
  };
}
carregar().catch(() => erroTela('Sem conexão. Confira a internet e tente de novo.'));
</script>
</body>
</html>
