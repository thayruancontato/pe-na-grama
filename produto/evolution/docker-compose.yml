# Servidor de WhatsApp (Evolution API v2) compartilhado por todas as escolas: uma instância (número) por escola.
# Sobe com:  docker compose up -d     (veja o LEIAME.md)
services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U evolution"], interval: 10s, retries: 10 }

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redisdata:/data]

  evolution:
    image: atendai/evolution-api:v2.1.1   # confira a versão estável mais nova em https://github.com/EvolutionAPI/evolution-api/releases
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      SERVER_URL: ${SERVER_URL}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      # economia de disco: guarda só o necessário para manter a conexão (as mensagens ficam no celular)
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CONFIG_SESSION_PHONE_CLIENT: Pe na Grama
      LOG_LEVEL: ERROR
    expose: ["8080"]
    volumes: [evoinstances:/evolution/instances]

  # Túnel gratuito do Cloudflare: o servidor não abre nenhuma porta para a internet e ganha HTTPS no seu domínio.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [evolution]

volumes: { pgdata: {}, redisdata: {}, evoinstances: {} }
